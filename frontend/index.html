<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ctrlX WebSocket UI</title>
    <link rel="stylesheet" href="index.css" />
  </head>

  <body>
    <header>
      <h1>ctrlX WebSocket Demo</h1>
      <div>
        <button id="btnConnect" class="btn" disabled>
          Obtener Datos del PLC
        </button>
        <button id="btnDisconnect" class="btn" disabled>Desconectar</button>
        <button id="btnTrends" class="btn btn-secondary" title="Ver tendencias">
          📈 Trends
        </button>
        <button id="btnLogout" class="btn btn-danger" title="Cerrar sesión">
          <span class="logout-icon">⏻</span> Cerrar sesión
        </button>
      </div>
    </header>

    <main>
      <div class="toolbar">
        <div id="status" class="status">WebSocket desconectado.</div>

        <div class="export-actions">
          <button id="btnExport" class="btn btn-secondary" disabled>
            Iniciar export
          </button>
          <span id="exportCount" class="export-badge">0</span>
        </div>
      </div>

      <table id="data-table">
        <thead>
          <tr>
            <th>Tag</th>
            <th>Valor</th>
            <th class="col-sel">
              <input type="checkbox" id="chkAll" title="Seleccionar todo" />
            </th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </main>

    <!-- 👇 Guardia: si no hay sesión, redirige al login -->
    <script>
      (function () {
        const parts = location.pathname.split("/").filter(Boolean);
        const prefix = parts.length ? `/${parts[0]}` : "";
        if (sessionStorage.getItem("auth_ok") !== "1") {
          location.replace(`${prefix}/login`);
        }
      })();
    </script>

    <script>
      document.getElementById("btnTrends")?.addEventListener("click", () => {
        const parts = location.pathname.split("/").filter(Boolean);
        const prefix = parts.length ? `/${parts[0]}` : "";
        location.href = `${prefix}/trends`;
      });
    </script>

    <script defer src="./js/app.js?v=20260220-1"></script>
  </body>
</html>
