<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ctrlX Login</title>

    <!-- Font Awesome para los íconos -->
    <link rel="stylesheet" href="styles/fontawesome-free-7.2.0-web/css/all.min.css" />

    <!-- CSS propio del login -->
    <link rel="stylesheet" href="styles/login.css" />
  </head>
  <body>
    <div id="loginOverlay" class="modal-overlay">
      <div
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="loginTitle"
      >
        <div class="modal-header">
          <h2 id="loginTitle">Iniciar sesión</h2>
          <div class="modal-sub">Panel de datos · ctrlX</div>
        </div>

        <form id="loginForm" class="modal-body">
          <!-- Usuario -->
          <div class="field">
            <label for="userInput">
              <i class="fa-solid fa-user"></i> Usuario
            </label>
            <input
              id="userInput"
              type="text"
              placeholder="Ej: admin"
              autocomplete="username"
              required
            />
          </div>

          <!-- Contraseña -->
          <div class="field">
            <label for="passInput">
              <i class="fa-solid fa-lock"></i> Contraseña
            </label>
            <div class="pass-row">
              <input
                id="passInput"
                type="password"
                placeholder="Ej: 1234"
                autocomplete="current-password"
                required
              />
              <i
                id="togglePassword"
                class="fa-regular fa-eye toggle-eye"
                title="Mostrar/ocultar contraseña"
              ></i>
            </div>
          </div>

          <!-- Endpoint OPC UA -->
          <div class="field">
            <label for="ipSelect">
              <i class="fa-solid fa-network-wired"></i> Endpoint OPC UA
            </label>
            <div class="select-with-status">
              <i
                id="ipStatusIcon"
                class="fa-solid fa-circle-question status-icon"
              ></i>
              <select id="ipSelect" required>
                <option value="" disabled selected>Cargando endpoints…</option>
              </select>
            </div>
            <small id="ipHint" class="muted" hidden></small>
          </div>

          <!-- Programa + botón lupa -->
          <div class="field">
            <label for="programSelect">
              <i class="fa-solid fa-microchip"></i> Programa
            </label>
            <div class="program-row">
              <select id="programSelect" required>
                <option value="" disabled selected>
                  Pulsa la lupa para listar programas
                </option>
              </select>
              <button
                type="button"
                id="btnDiscoverPrograms"
                class="btn btn-secondary"
                title="Buscar programas en el PLC"
              >
                <i class="fa-solid fa-magnifying-glass"></i>
              </button>
            </div>
            <small id="programHint" class="muted"></small>
          </div>

          <!-- Error -->
          <div id="loginErr" class="login-error" hidden>
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="errorText"></span>
          </div>

          <!-- Footer -->
          <div class="modal-footer">
            <button id="btnLogin" class="btn" type="submit">
              <i class="fa-solid fa-right-to-bracket"></i> Ingresar
            </button>
          </div>
        </form>
      </div>
    </div>

    <script defer src="./js/login.js?v=20260220-3"></script>
  </body>
</html>
